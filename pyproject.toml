[project]
name = "ml-ai-platform"
version = "0.1.0"
description = "Domain-agnostic ML/AI evaluation and lifecycle platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0,<7",
]

[project.scripts]
mlai = "ml_ai_platform.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_ai_platform"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
